apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devscalecloud/k8s-gitops-practical.git
    targetRevision: main
    path: charts/demo-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true    # delete cluster resources whose manifest was removed from Git
      selfHeal: true # revert any manual drift so the cluster always matches Git
    syncOptions:
      - CreateNamespace=true
