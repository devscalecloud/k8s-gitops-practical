# Requires the AWS Load Balancer Controller to be installed first -- see
# ../docs/README.md. Without it, this Ingress sits with no ADDRESS.
#
# /api goes to the backend so the browser can call it same-origin-ish
# (same ALB, avoids needing a second public DNS name) -- the backend's own
# CORS header (see app/backend/src/server.ts) still makes cross-origin calls
# work regardless, but routing both through one ALB keeps things simple.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app-ingress
  namespace: demo-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # More specific path first -- ALB Controller evaluates rules in
          # the order they're listed, not by specificity.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
