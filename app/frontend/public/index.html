<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Frontend / Backend Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    button { font-size: 1rem; padding: 10px 20px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 16px; border-radius: 6px; white-space: pre-wrap; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Frontend calling Backend</h1>
  <p>Clicking the button makes the <strong>browser</strong> call the backend's
     <code>/api/greeting</code> endpoint directly.</p>
  <button id="fetch-btn">Call backend</button>
  <pre id="result">(nothing yet)</pre>

  <script src="/config.js"></script>
  <script>
    document.getElementById("fetch-btn").addEventListener("click", async () => {
      const resultEl = document.getElementById("result");
      resultEl.textContent = "Loading...";
      resultEl.classList.remove("error");
      try {
        const res = await fetch(window.BACKEND_URL + "/greeting");
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        const data = await res.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.classList.add("error");
        resultEl.textContent = "Request failed: " + err.message;
      }
    });
  </script>
</body>
</html>
