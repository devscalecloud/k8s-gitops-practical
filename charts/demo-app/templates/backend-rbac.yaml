apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: {{ include "demo-app.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-configmap-reader
  namespace: {{ include "demo-app.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-configmap-reader-binding
  namespace: {{ include "demo-app.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: {{ include "demo-app.namespace" . }}
roleRef:
  kind: Role
  name: backend-configmap-reader
  apiGroup: rbac.authorization.k8s.io
