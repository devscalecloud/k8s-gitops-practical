apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-frontend
  namespace: {{ include "demo-app.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        # namespaceSelector + podSelector in the SAME list item = AND:
        # only app=frontend pods that are ALSO in the demo-app namespace.
        # As two separate list items this would be OR instead -- either
        # condition alone would be enough.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "demo-app.namespace" . }}
          podSelector:
            matchLabels:
              app: frontend
        # The ALB routes /api requests straight to backend pod IPs
        # (target-type: ip), bypassing the frontend Service entirely -- that
        # traffic arrives from the ALB Controller's ENIs, not from a pod
        # with any label this policy could otherwise match, so it needs its
        # own explicit allow via the VPC CIDR rather than a podSelector.
        - ipBlock:
            cidr: {{ .Values.vpcCidr | default "10.43.0.0/16" | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
