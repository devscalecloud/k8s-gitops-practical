apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "demo-app.namespace" . }}
  labels:
    app: frontend
  annotations:
    # Sync wave 0 (the default -- set explicitly here so the ordering
    # relative to backend's wave -1 is obvious at a glance). Won't start
    # applying until every wave -1 resource (backend) is Healthy.
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
            - name: BACKEND_URL
              value: {{ .Values.frontend.backendUrl | quote }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
