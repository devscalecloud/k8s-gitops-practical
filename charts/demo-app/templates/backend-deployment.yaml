apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "demo-app.namespace" . }}
  labels:
    app: backend
  annotations:
    # Sync wave -1: deploys before wave 0 (frontend) and must reach Healthy
    # before ArgoCD proceeds to the next wave -- separate mechanism from
    # the PreSync hook above (hooks run once outside normal resource sync;
    # waves order the regular, ongoing-reconciled resources against each
    # other within that sync).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
